<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ورقة العمل الجماعية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: official logo band, navy bars with yellow number badges (per the school reference), laptop width. */
:root {
  --bg: #f4f6fb; --surface: #ffffff; --surface-2: #f1f4f9;
  --ink: #18223a; --ink-soft: #5b6478; --rule: #dfe4ee;
  --accent: #24375e; --accent-2: #2f4a7d; --accent-dark: #16233d; --accent-ink: #ffffff; --accent-wash: #edf1f8;
  --hot: #f5b301; --hot-ink: #1c2b4a;
  --g1: #16a34a; --g1-wash: #ecfdf3;
  --g2: #dc2626; --g2-wash: #fef2f2;
  --g3: #2563eb; --g3-wash: #eff6ff;
  --g4: #ea580c; --g4-wash: #fff7ed;
  --ok: #15803d; --ok-wash: #ecfdf3; --mid: #a16207; --mid-wash: #fefce8; --bad: #b91c1c; --bad-wash: #fef2f2;
  --font: "Readex Pro", "Segoe UI", Tahoma, sans-serif;
  --display: "Readex Pro", "Segoe UI", sans-serif;
  --radius: 14px;
  --shadow: 0 4px 14px rgba(22, 35, 61, .08);
  --bar: linear-gradient(135deg, #1a2744 0%, #2a426e 100%);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1424; --surface: #172036; --surface-2: #1d2842; --ink: #e8ecf5; --ink-soft: #a3adc4; --rule: #2a3653;
    --accent: #3d5c96; --accent-2: #4a6aa8; --accent-dark: #101a2e; --accent-ink: #ffffff; --accent-wash: #1e2a47;
    --g1: #4ade80; --g1-wash: #13251a; --g2: #f87171; --g2-wash: #2a1616; --g3: #6d8dff; --g3-wash: #161c33; --g4: #fb923c; --g4-wash: #2a1c12;
    --ok: #4ade80; --ok-wash: #13251a; --mid: #facc15; --mid-wash: #29240f; --bad: #f87171; --bad-wash: #2a1616;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1424; --surface: #172036; --surface-2: #1d2842; --ink: #e8ecf5; --ink-soft: #a3adc4; --rule: #2a3653;
  --accent: #3d5c96; --accent-2: #4a6aa8; --accent-dark: #101a2e; --accent-ink: #ffffff; --accent-wash: #1e2a47;
  --g1: #4ade80; --g1-wash: #13251a; --g2: #f87171; --g2-wash: #2a1616; --g3: #6d8dff; --g3-wash: #161c33; --g4: #fb923c; --g4-wash: #2a1c12;
  --ok: #4ade80; --ok-wash: #13251a; --mid: #facc15; --mid-wash: #29240f; --bad: #f87171; --bad-wash: #2a1616;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.7;
  min-height: 100vh; display: flex; flex-direction: column;
}
main#app { flex: 1; }
img { max-width: 100%; }
[hidden] { display: none !important; }
h1, h2, h3 { font-family: var(--font); font-weight: 700; line-height: 1.4; text-wrap: balance; margin: 0; }
h1 { font-size: 1.5rem; } h2 { font-size: 1.15rem; } h3 { font-size: 1rem; }
.wrap { width: min(1240px, 100% - 32px); margin: 0 auto; }

/* header: official logo band, navy bar, navy footer */
.site-head .navbar { background: var(--bar); color: #fff; box-shadow: 0 6px 20px rgba(22, 35, 61, .25); position: relative; overflow: hidden; }
.site-head .navbar::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .5;
  background-image: radial-gradient(circle at 12% 30%, rgba(255,255,255,.35) 0 1.5px, transparent 2px), radial-gradient(circle at 70% 70%, rgba(255,255,255,.25) 0 1.5px, transparent 2px), radial-gradient(circle at 40% 15%, rgba(255,255,255,.3) 0 1px, transparent 1.5px), radial-gradient(circle at 88% 25%, rgba(255,255,255,.3) 0 1px, transparent 1.5px); }
.navbar .wrap { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 14px; flex-wrap: wrap; position: relative; }
.brand { display: flex; align-items: center; gap: 12px; color: #fff; text-decoration: none; }
.brand-badge { width: 46px; height: 46px; border-radius: 50%; background: var(--hot); color: var(--hot-ink); display: grid; place-items: center; font-size: 1.35rem; font-weight: 700; flex: none; }
.brand b { font-size: 1.55rem; font-weight: 700; line-height: 1.2; display: block; }
.brand small { display: block; color: #cfd8ea; font-size: .92rem; }
.brand small em { font-style: normal; color: var(--hot); font-weight: 600; }
#nav .btn, #nav button { background: rgba(255, 255, 255, .08); color: #fff; border: 1px solid rgba(255, 255, 255, .25); box-shadow: none; border-radius: 999px; }
#nav .btn:hover, #nav button:hover { background: rgba(255, 255, 255, .18); color: #fff; }
main#app { padding-block: 26px 44px; }
.site-foot { background: var(--bar); color: #cfd8ea; padding-block: 18px; text-align: center; font-size: .95rem; }
.site-foot b { color: #fff; } .site-foot em { font-style: normal; color: var(--hot); font-weight: 600; }
.num-badge { width: 34px; height: 34px; border-radius: 50%; background: var(--hot); color: var(--hot-ink); display: grid; place-items: center; font-weight: 700; flex: none; font-size: 1rem; box-shadow: 0 2px 6px rgba(245, 179, 1, .35); }
.import-box { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px; border-radius: 12px; border: 1px dashed var(--accent-2); background: var(--accent-wash); }
.file-btn { margin: 0; cursor: pointer; } .file-btn input { display: none; }
.btn.primary { background: var(--bar); color: #fff; border-color: var(--accent-dark); }
.all-sheets { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 12px; border-radius: 12px; background: #fff8e1; border: 1px solid #f3dc8f; }
.sheet-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border: 1px solid var(--rule); border-radius: 10px; }
.sheet-row.on { border-color: var(--ok); background: var(--ok-wash); }
.warn-row td { background: var(--bad-wash); }
.pin-mask { -webkit-text-security: disc; text-security: disc; }
.done-board { padding: 14px 16px; }
.done-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--rule); margin-top: 6px; }
.done-row.ok { background: #e9f7ee; border-color: #8fd0a6; }
button.g-done { box-shadow: inset 0 -3px 0 #2e9e5b; }
.print-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px; border-radius: 12px; background: var(--surface-2); border: 1px dashed var(--rule); }

.muted { color: var(--ink-soft); }
.small { font-size: .875rem; }
button, .btn {
  font: inherit; font-weight: 600; font-size: .95rem; cursor: pointer; border-radius: 8px; border: 1px solid var(--rule);
  background: var(--surface); color: var(--ink); padding: 7px 14px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 1px 0 rgba(0, 0, 0, .04);
}
button:hover, .btn:hover { background: var(--surface-2); }
button:focus-visible, .btn:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, .pick:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--bar); color: var(--accent-ink); border-color: var(--accent-dark); }
button.primary:hover { filter: brightness(1.06); }
button.ghost, .btn.ghost { background: transparent; box-shadow: none; border-color: transparent; color: var(--ink-soft); }
button.ghost:hover, .btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
button:disabled { opacity: .5; cursor: not-allowed; }
input, textarea, select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 8px 12px; width: 100%; }
input:focus, textarea:focus, select:focus { border-color: var(--accent); }
textarea { resize: vertical; min-height: 88px; }
label, .label { font-weight: 600; font-size: .9rem; display: block; margin-bottom: 6px; }

/* boxed panels with a navy title bar */
.paper, .q, .gcol, .result-card, .sheet-head, .gen-group { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--radius); box-shadow: var(--shadow); }
.paper { padding: 0 20px 20px; overflow: hidden; }
.paper > h2:first-child, .paper > .row:first-child, .result-card > h2:first-child, .result-card > .row:first-child, .gen-group > h3:first-child {
  margin: 0 -20px; padding: 10px 20px; background: var(--bar); color: #fff; border-bottom: 3px solid var(--accent-dark);
}
.paper > .row:first-child h2, .result-card > .row:first-child h2 { color: #fff; }
.paper > .row:first-child .lvl, .paper > .row:first-child .muted { color: #fff; border-color: rgba(255, 255, 255, .5); }
.paper > .row:first-child button:not(.primary) { background: rgba(255, 255, 255, .9); }
.paper > :first-child + * { margin-top: 0; }
.paper.stack > :first-child + * { margin-top: 2px; }
.paper.empty-state, .paper:not(.stack) { padding-top: 20px; }
.paper.empty-state > h2:first-child, .paper:not(.stack) > h2:first-child { margin: -20px -20px 14px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
.pick { text-align: start; padding: 0; border-radius: var(--radius); border: 1px solid var(--rule); background: var(--surface); cursor: pointer; font: inherit; color: var(--ink); box-shadow: var(--shadow); overflow: hidden; display: block; }
.pick { background: var(--bar); border-color: transparent; color: #fff; padding: 22px 20px; position: relative; }
.pick::before { content: attr(data-n); position: absolute; top: 16px; inset-inline-end: 16px; width: 40px; height: 40px; border-radius: 50%; background: var(--hot); color: var(--hot-ink); display: grid; place-items: center; font-weight: 700; }
.pick .big { font-weight: 700; font-size: 1.6rem; display: block; color: #fff; }
.pick .muted { display: block; color: #cfd8ea; margin-top: 4px; }
.pick:hover { border-color: var(--accent); transform: translateY(-2px); }
.hero { padding: 20px 24px; margin-bottom: 20px; background: var(--surface); border: 1px solid var(--rule); border-inline-start: 6px solid var(--hot); border-radius: var(--radius); box-shadow: var(--shadow); }
.hero h1 { color: var(--accent); }
.hero a { color: var(--accent-2); }
.hero p { margin: 4px 0 0; max-width: 70ch; }

.av { width: 42px; height: 42px; border-radius: 50%; flex: none; object-fit: cover; display: grid; place-items: center; font-weight: 700; color: var(--gc, var(--accent)); background: var(--gw, var(--accent-wash)); overflow: hidden; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--rule); }
.av.lg { width: 64px; height: 64px; font-size: 1.4rem; }
.av.sm { width: 30px; height: 30px; font-size: .78rem; }
.g1 { --gc: var(--g1); --gw: var(--g1-wash); } .g2 { --gc: var(--g2); --gw: var(--g2-wash); }
.g3 { --gc: var(--g3); --gw: var(--g3-wash); } .g4 { --gc: var(--g4); --gw: var(--g4-wash); }

.groups-pick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.gcol { padding: 0 10px 12px; display: flex; flex-direction: column; gap: 4px; overflow: hidden; }
.gcol h3 { display: flex; align-items: center; gap: 8px; margin: 0 -10px 6px; padding: 10px 14px; background: var(--bar); color: #fff; border-bottom: 3px solid var(--accent-dark); }
.gcol h3::before, .tag::before, .gen-group h3::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--gc); flex: none; border: 2px solid #fff; }
.stu-btn { display: flex; align-items: center; gap: 10px; width: 100%; padding: 7px 8px; border-radius: 8px; border: 1px solid transparent; background: transparent; text-align: start; box-shadow: none; font-weight: 500; }
.stu-btn:hover { background: var(--accent-wash); border-color: var(--accent-2); }

/* student sheet: sidebar + questions grid */
.sheet-layout { display: grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: start; }
.side { position: sticky; top: 14px; }
.q-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 18px; align-items: start; }
.sheet-head { overflow: hidden; }
.sheet-band { padding: 14px 18px; display: flex; flex-direction: column; gap: 4px; background: var(--bar); color: #fff; border-bottom: 3px solid var(--accent-dark); }
.sheet-band h1 { font-family: var(--display); font-size: 1.35rem; }
.sheet-band .muted { color: #e2f7f4; }
.sheet-band .tag { display: inline-flex; align-items: center; gap: 6px; font-size: .85rem; font-weight: 600; color: #fff; }
.sheet-meta { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
.member { display: flex; align-items: center; gap: 8px; font-size: .95rem; }
.member.me { font-weight: 700; }
.you { font-size: .72rem; background: var(--hot); color: var(--hot-ink); padding: 0 8px; border-radius: 999px; }
.objective { padding: 10px 16px; border-bottom: 1px solid var(--rule); background: #fff8e1; color: #3b2f00; font-size: .95rem; }
.objective b { color: #8a5a00; }
.q { padding: 0 18px 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
.q.mine { border-color: var(--hot); box-shadow: 0 0 0 3px rgba(245, 179, 1, .18), var(--shadow); }
.q-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 -18px; padding: 8px 18px; background: var(--surface-2); border-bottom: 1px solid var(--rule); }
.q.mine .q-head { background: var(--bar); color: #fff; border-bottom: 3px solid var(--accent-dark); }
.q.mine .q-head .q-num { color: #fff; }
.q.mine .q-head .kind, .q.mine .q-head .lvl { background: rgba(255, 255, 255, .2); color: #fff; border-color: rgba(255, 255, 255, .4); }
.q-owner { display: flex; align-items: center; gap: 10px; line-height: 1.4; }
.q-num { font-weight: 700; color: var(--accent-dark); }
.q-prompt { font-size: 1.05rem; white-space: pre-wrap; margin: 0; font-weight: 600; }
.lvl { font-size: .75rem; font-weight: 600; padding: 1px 8px; border-radius: 999px; color: var(--ink-soft); border: 1px solid var(--rule); background: var(--surface); }
.kind { font-size: .75rem; font-weight: 600; padding: 1px 10px; border-radius: 999px; background: var(--accent-wash); color: var(--accent-dark); }
.answer-box { background: var(--surface-2); border-radius: 8px; padding: 10px 14px; min-height: 44px; white-space: pre-wrap; border: 1px dashed var(--rule); }
.answer-box.empty { color: var(--ink-soft); }
.save-state { font-size: .82rem; color: var(--ink-soft); }
.comments { border-top: 1px solid var(--rule); padding-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.cmt { display: flex; gap: 8px; align-items: flex-start; }
.cmt-body { background: var(--surface-2); border-radius: 8px; padding: 6px 12px; flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: .95rem; }
.cmt-body b { font-size: .82rem; color: var(--accent-dark); }
.cmt-form { display: flex; gap: 8px; }
.cmt-form input { flex: 1; min-width: 0; }
.mark { font-weight: 600; font-size: .8rem; padding: 1px 10px; border-radius: 999px; }
.mark.correct { background: var(--ok-wash); color: var(--ok); }
.mark.partial { background: var(--mid-wash); color: var(--mid); }
.mark.wrong { background: var(--bad-wash); color: var(--bad); }
.solution { background: var(--ok-wash); border-radius: 8px; padding: 10px 14px; white-space: pre-wrap; }
.solution b { color: var(--ok); }
.choices { display: flex; flex-direction: column; gap: 8px; }
.choice { display: flex; align-items: center; gap: 10px; padding: 9px 14px; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); font-weight: 500; margin: 0; cursor: pointer; }
.choice:hover { border-color: var(--accent); }
.choices.ro .choice { cursor: default; }
.choices.ro .choice:hover { border-color: var(--rule); }
.choice.on { border-color: var(--accent); background: var(--accent-wash); font-weight: 600; }
.choice input { width: auto; accent-color: var(--accent); margin: 0; }
.items { margin: 0; padding-inline-start: 22px; display: flex; flex-direction: column; gap: 14px; }
.items.single { list-style: none; padding: 0; }
.items li::marker { font-weight: 700; color: var(--accent); }
.item-q { margin: 0 0 8px; font-weight: 600; }
.items .choices { flex-direction: row; flex-wrap: wrap; }
.items .choice { flex: 1 1 160px; }
.result-card { padding: 0 20px 16px; overflow: hidden; }
.side .result-card .row:first-child { margin: 0 -20px; }
.score { font-size: 1.6rem; font-weight: 700; color: #fff; font-variant-numeric: tabular-nums; }
.result-card:not(:has(> .row:first-child)) .score { color: var(--accent); }

/* teacher */
.tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 3px solid var(--hot); }
.tabs button { background: var(--surface-2); border: 1px solid var(--rule); border-bottom: 0; border-radius: 8px 8px 0 0; box-shadow: none; color: var(--ink-soft); padding: 8px 18px; }
.tabs button:hover { color: var(--ink); background: var(--surface); }
.tabs button[aria-selected="true"] { background: var(--bar); color: #fff; border-color: var(--accent); }
.table-wrap { overflow-x: auto; }
.class-tabs { display: flex; gap: 6px; flex-wrap: wrap; padding: 6px; background: var(--surface-2); border: 1px solid var(--rule); border-radius: 10px; }
.class-tabs button { box-shadow: none; min-width: 72px; justify-content: center; }
.class-tabs button[aria-selected="true"] { background: var(--bar); color: #fff; border-color: var(--accent-dark); }
.gtables { display: grid; grid-template-columns: repeat(auto-fit, minmax(560px, 1fr)); gap: 16px; }
.gtable { border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
.gtable h3 { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--surface-2); border-bottom: 1px solid var(--rule); }
.gtable h3::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--gc); flex: none; }
.gtable h3 .small { font-weight: 500; color: var(--ink-soft); }
.gtable table { min-width: 520px; }
.gtable th, .gtable td { padding: 6px 8px; }
.gtable select { min-width: 96px; padding-inline-end: 4px; }
.gtable td:first-child .file-label { font-size: .8rem; }
table { border-collapse: collapse; width: 100%; min-width: 620px; }
th, td { padding: 8px; border-bottom: 1px solid var(--rule); text-align: start; vertical-align: middle; }
th { font-size: .82rem; color: var(--accent-dark); font-weight: 700; background: var(--accent-wash); }
td input, td select { padding: 6px 8px; }
.photo-cell { display: flex; align-items: center; gap: 8px; }
.file-label { font-weight: 600; font-size: .85rem; color: var(--accent); cursor: pointer; margin: 0; }
.file-label input { display: none; }
.gen-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.gen-group { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
.gen-group > h3:first-child { margin: 0 -14px; padding: 10px 14px; display: flex; align-items: center; gap: 8px; color: #fff !important; }
.gen-q { display: flex; flex-direction: column; gap: 6px; border-bottom: 1px solid var(--rule); padding-bottom: 12px; }
.gen-q:last-child { border-bottom: 0; padding-bottom: 0; }
.mark-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.mark-btns button { padding: 4px 12px; font-size: .85rem; }
.mark-btns button.on.correct { background: var(--ok); color: #fff; border-color: var(--ok); }
.mark-btns button.on.partial { background: var(--mid); color: #fff; border-color: var(--mid); }
.mark-btns button.on.wrong { background: var(--bad); color: #fff; border-color: var(--bad); }
details summary { cursor: pointer; }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--accent-dark); color: #fff; padding: 10px 18px; border-radius: 8px; z-index: 50; max-width: calc(100% - 32px); font-size: .95rem; box-shadow: var(--shadow); }
.notice { background: var(--mid-wash); color: var(--ink); border-radius: 8px; padding: 10px 14px; }
.empty-state { text-align: center; padding: 32px 16px; }
@media (max-width: 1000px) {
  .sheet-layout { grid-template-columns: 1fr; }
  .side { position: static; }
  .groups-pick { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 560px) {
  .q-grid { grid-template-columns: 1fr; }
  .groups-pick { grid-template-columns: 1fr; }
  .brand b { font-size: 1.2rem; }
  h1 { font-size: 1.25rem; } .q { padding: 0 14px 14px; } .q-head { margin: 0 -14px; padding: 8px 14px; }
}
@media (prefers-reduced-motion: no-preference) { .q, .pick, .choice, button { transition: border-color .15s, background-color .15s, box-shadow .15s, transform .15s; } }
</style>
</head>
<body>
<header class="site-head">
  <div class="navbar"><div class="wrap">
    <a class="brand" href="#/"><span class="brand-badge" aria-hidden="true">✎</span><span><b>ورقة العمل الجماعية</b><small>إعداد <em>الأستاذ الحسن علي</em></small></span></a>
    <nav class="row" id="nav"></nav>
