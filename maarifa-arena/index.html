<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6fa">
<title>ساحة التحدي المعرفي</title>
<meta name="app-version" content="5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Lalezar&display=swap">
<style>
/* ألوان هادئة: الكهرماني للأسئلة، الفيروزي للأجوبة، المرجاني للالتقاط، والباقي رمادي مريح */
:root{
  --bg:#f5f6fa; --bg2:#f9fafc; --panel:#ffffff; --panel2:#eef0f6; --line:#e0e3ec;
  --ink:#262b40; --muted:#6b7189; --gold:#ecc56a; --gold-t:#94681a; --gold-ink:#3d2a05; --cyan:#7cc7cf; --cyan-t:#2a7c86; --cyan-ink:#0f3a3f;
  --hot:#e2717f; --ok:#4aa77a; --bad:#cf5c63;
  --display:"Lalezar","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(900px 460px at 85% -160px,#fbf0d9 0%,transparent 60%),radial-gradient(900px 460px at 10% -160px,#e0f2f3 0%,transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:max(12px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px));-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:14px;padding:12px 18px;font-weight:700;background:var(--panel2);color:var(--ink);min-height:48px;transition:transform .08s,filter .2s,opacity .2s}
button:hover{filter:brightness(1.04)}
button:active{transform:scale(.97)}
button:disabled{opacity:.4;cursor:not-allowed}
button.gold{background:var(--gold);color:var(--gold-ink)}
button.cyan{background:var(--cyan);color:var(--cyan-ink)}
button.ok{background:var(--ok);color:#fff}
button.bad{background:var(--bad);color:#fff}
button.hot{background:var(--hot);color:#fff}
button.ghost{background:var(--panel);border:2px solid var(--line)}
button.sm{min-height:38px;padding:6px 12px;font-size:14px;border-radius:10px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input,select,textarea{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff;min-height:48px}
input:focus,textarea:focus{border-color:var(--gold);outline:none}
textarea{min-height:100px;resize:vertical}
label{font-weight:700;font-size:14px;color:var(--muted);display:block;margin-bottom:6px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.25;text-wrap:balance}
.wrap{max-width:2200px;margin:0 auto}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 6px 24px #1a215012}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.center{text-align:center}
.num{font-variant-numeric:tabular-nums}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:12px 20px;border-radius:14px;z-index:60;max-width:90vw;font-weight:700;box-shadow:0 10px 30px #1a215033}
.toast.err{background:var(--bad);color:#fff;border-color:var(--bad)}
.toast.win{background:var(--ok);color:#fff;border-color:var(--ok)}

/* الصفحة الأولى */
.hero{padding:44px 0 28px;text-align:center}
.logo{font-family:var(--display);font-size:clamp(44px,9vw,86px);line-height:1.05;letter-spacing:.5px}
.logo .q{color:var(--gold-t)}
.logo .a{color:var(--cyan-t)}
.hero p{font-size:18px;color:var(--muted);max-width:620px;margin:10px auto 0}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;max-width:780px;margin:0 auto}
.choice{background:var(--panel);box-shadow:0 6px 24px #1a215012;border:2px solid var(--line);border-radius:22px;padding:26px;text-align:right;display:flex;flex-direction:column;gap:6px;min-height:150px}
.choice b{font-family:var(--display);font-weight:400;font-size:32px}
.choice span{font-weight:400;color:var(--muted)}
.choice:hover{border-color:var(--gold)}
.rules{max-width:780px;margin:24px auto 0}
.rules ol{margin:8px 0 0;padding-inline-start:22px}
.form{max-width:540px;margin:20px auto}
/* شاشات الكمبيوتر العريضة: كل الصفحات تمتد بعرض الشاشة */
@media (min-width:1100px){
  .choices,.rules{max-width:none}
  .choices{grid-template-columns:1fr 1fr}
  .form{max-width:min(1200px,100%)}
  .hero p{max-width:900px}
  .roles{gap:16px}.rolecard{padding:28px}
  .rules ol{columns:2;column-gap:40px}
}
@media (min-width:1600px){body{font-size:18px}.lb li .s{font-size:28px}.stage .bigq{font-size:clamp(34px,3vw,58px)}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* الشريط العلوي */
.hud{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.hud h2{font-size:clamp(22px,3vw,30px)}
.code{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px 14px;display:flex;align-items:center;gap:10px}
.code small{color:var(--muted);font-weight:700}
.code b{font-family:var(--display);font-weight:400;font-size:28px;letter-spacing:4px;color:var(--gold-t)}
.bigclock{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
.bigclock small{color:var(--muted);font-weight:700}
.bigclock b{font-family:var(--display);font-weight:400;font-size:30px;font-variant-numeric:tabular-nums}
.bigclock.low b{color:var(--hot)}
.me{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 12px}
.badge{font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px}
.badge.asker{background:var(--gold);color:var(--gold-ink)}
.badge.answerer{background:var(--cyan);color:var(--cyan-ink)}
.me .pts{font-family:var(--display);font-size:28px;line-height:1}

/* اللوحة: صف أسئلة وصف أجوبة */
.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px;position:relative}
.rowlabel{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--muted)}
.rowlabel i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tile{min-height:128px;max-width:100%;border-radius:16px;padding:8px;display:flex;flex-direction:column;justify-content:space-between;align-items:stretch;text-align:center;min-height:0;min-width:0;overflow:hidden;position:relative;font-weight:500;border:2px solid transparent}
.tile .n{font-family:var(--display);font-size:clamp(18px,2.6vw,30px);line-height:1;opacity:.9}
.tile .t{font-size:clamp(12px,1.15vw,14px);line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.tile .who{font-size:clamp(10px,1vw,12px);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .pt{direction:ltr;unicode-bidi:isolate;position:absolute;top:6px;left:6px;font-size:12px;font-weight:700;padding:1px 7px;border-radius:99px;background:#ffffffcc;color:var(--ink)}
.q-empty{background:#fdf8ec;border-color:#efdcab;color:var(--gold-t)}
.q-empty.can{cursor:pointer;border-color:var(--gold);box-shadow:0 0 0 0 #ecc56a55;animation:glow 2s infinite}
.q-empty.can:hover{background:#fbefd2}
@keyframes glow{50%{box-shadow:0 0 14px 2px #ecc56a66}}
.q-full{background:linear-gradient(160deg,#f6dd9a,#ecc56a);color:var(--gold-ink)}
.q-full.dim{filter:saturate(.35);opacity:.7}
.a-empty{background:#eef8f9;border-color:#c4e5e8;color:#4e98a0}
.a-full{background:linear-gradient(160deg,#b6e2e6,#7cc7cf);color:var(--cyan-ink)}
.a-wrong{background:#fbeaec;color:#a8434d;border-color:#f0c3c8}
.a-miss{background:repeating-linear-gradient(135deg,#f1f3fb 0 10px,#e7ebf7 10px 20px);color:var(--muted);border-color:var(--line)}
.tile.live{border-color:var(--hot);box-shadow:0 0 0 3px #e2717f44,0 0 18px #e2717f44;animation:none}
.tile.clickable{cursor:pointer}
.locked .q-empty.can{animation:none;cursor:not-allowed;border-color:#efdcab}
.lockveil{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}

/* الحلبة: السؤال الكبير */
.stage{border-radius:24px;padding:20px;box-shadow:0 8px 30px #1a215014;background:radial-gradient(600px 220px at 50% 0,#f1f2fb,transparent),var(--panel);border:1px solid var(--line);margin-bottom:14px;position:relative;overflow:hidden}
.stage .kicker{font-weight:700;color:var(--muted);font-size:15px}
.stage .bigq{font-size:clamp(24px,4.2vw,46px);font-weight:700;line-height:1.35;overflow-wrap:anywhere;white-space:pre-wrap;text-align:center;margin:8px 0}
.stage .biga{font-size:clamp(20px,3vw,32px);font-weight:700;color:var(--cyan-t);text-align:center;overflow-wrap:anywhere;white-space:pre-wrap}
.ring{--p:100;width:118px;height:118px;border-radius:50%;background:conic-gradient(var(--rc,var(--gold)) calc(var(--p)*1%),#e8eaf2 0);display:grid;place-items:center;flex:none}
.ring b{width:94px;height:94px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-family:var(--display);font-weight:400;font-size:40px;font-variant-numeric:tabular-nums}
.ring.low{--rc:var(--hot)}
.capture{width:100%;min-height:180px;border-radius:28px;font-family:var(--display);font-weight:400;font-size:clamp(40px,10vw,72px);background:radial-gradient(circle at 50% 30%,#ef9ca7,var(--hot));color:#fff;box-shadow:0 10px 0 #b9505e,0 0 26px #e2717f44;animation:pulse 1s infinite}
.capture:active{box-shadow:0 2px 0 #b9505e;transform:translateY(8px)}
@keyframes pulse{50%{filter:brightness(1.08);transform:scale(1.015)}}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.judge button{min-height:66px;font-size:20px}

/* لوحة النتائج */
.lb{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lb h3{font-size:22px;margin-bottom:6px}
.lb ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.lb li{display:flex;align-items:center;gap:10px;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:6px 10px;font-weight:700}
.lb li .r{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:var(--panel2);flex:none}
.lb li .s{margin-inline-start:auto;font-family:var(--display);font-weight:400;font-size:24px;font-variant-numeric:tabular-nums}
.lb li.mine{border-color:var(--gold)}
.lb li .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .gold-t{color:var(--gold-t)} .lb .cyan-t{color:var(--cyan-t)}
.lb li.idle{opacity:.5}
.lb li button{all:unset;cursor:pointer;display:flex;align-items:center;gap:10px;flex:1;min-width:0}

/* الأدوار */
.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rolecard{border-radius:20px;padding:20px;text-align:center;border:3px solid var(--line);background:#fff;display:flex;flex-direction:column;gap:4px;align-items:center}
.rolecard b{font-family:var(--display);font-weight:400;font-size:30px}
.rolecard span{font-weight:400;color:var(--muted);font-size:14px}
.rolecard .cnt{font-style:normal;font-weight:700;font-size:13px;margin-top:4px;padding:2px 10px;border-radius:99px;background:var(--panel2);color:var(--ink)}
.rolecard:disabled{opacity:.45;filter:grayscale(.6)}
.rolecard.asker b{color:var(--gold-t)} .rolecard.answerer b{color:var(--cyan-t)}
.rolecard.asker.on{border-color:var(--gold);background:#fdf3dc}
.rolecard.answerer.on{border-color:var(--cyan);background:#e6f5f6}

/* النهاية */
.podium{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.champ{border-radius:24px;padding:24px;text-align:center;border:2px solid}
.champ.gold-c{border-color:var(--gold);background:radial-gradient(circle at 50% 0,#fbeccb,var(--panel))}
.champ.cyan-c{border-color:var(--cyan);background:radial-gradient(circle at 50% 0,#d8eff1,var(--panel))}
.champ .crown{font-size:46px;line-height:1}
.champ .nm{font-family:var(--display);font-size:clamp(30px,5vw,48px)}
.champ .sc{font-family:var(--display);font-size:clamp(40px,7vw,72px);line-height:1}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:55}

.modal{position:fixed;inset:0;background:#1a215066;backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal .panel{max-width:540px;width:100%;max-height:90vh;overflow:auto}
.qr{display:flex;justify-content:center}
.qr img{width:240px;height:240px;image-rendering:pixelated;border-radius:12px;background:#fff;padding:6px}
.linkbox{direction:ltr;text-align:left;background:var(--bg2);border-radius:10px;padding:10px;font-size:14px;overflow-wrap:anywhere;user-select:all}
.layout{display:grid;grid-template-columns:minmax(0,1fr) clamp(300px,24vw,420px);gap:16px;align-items:start}
@media (min-width:981px){.tile{min-height:clamp(110px,13vh,180px)}}
@media (max-width:980px){.layout{grid-template-columns:1fr}}
@media (max-width:640px){
  .board{gap:5px}
  .tile{border-radius:10px;padding:4px;min-height:0;aspect-ratio:1/1;justify-content:center}
  .tile .t,.tile .who{display:none}
  .tile .pt{display:none}
  .tile .who{display:none}
  .lb,.podium,.roles{grid-template-columns:1fr}
  .ring{width:92px;height:92px}.ring b{width:72px;height:72px;font-size:30px}
}
/* أيقونات متحركة */
.ic{display:inline-block;line-height:1}
.ic.bob{animation:bob 2.4s ease-in-out infinite}
.ic.spin{animation:spin 2.6s linear infinite}
.ic.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.ic.wig{animation:wig 1.8s ease-in-out infinite}
.ic.beat{animation:beat 1.1s ease-in-out infinite}
.ic.float{animation:float 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg)}75%{transform:rotate(12deg)}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
@keyframes float{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.stage{animation:rise .35s ease both}
.bigicon{font-size:56px;line-height:1}
.choice .ic{font-size:34px}
.mute{min-width:44px;padding:6px 10px}

/* قسم: المعلم يسأل */
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.modecard{border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px 10px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center;font-weight:400}
.modecard b{font-family:var(--display);font-weight:400;font-size:22px}
.modecard span{font-size:13px;color:var(--muted)}
.modecard .ic{font-size:30px}
.modecard.on{border-color:var(--gold);background:#fdf6e6}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.slot{border:2px dashed var(--line);border-radius:16px;padding:10px;text-align:center;min-height:92px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:var(--bg2);min-width:0}
.slot .no{font-family:var(--display);font-size:26px;line-height:1;color:var(--muted)}
.slot .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;font-size:clamp(14px,1.8vw,19px)}
.slot small{color:var(--muted);font-weight:700;font-size:12px}
.slot.on{border-style:solid;border-color:var(--cyan);background:#eef8f9;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.slot.on .no{color:var(--cyan-t)}
.slot.me{box-shadow:0 0 0 3px #ecc56a99}
.answers{display:flex;flex-direction:column;gap:10px}
.ans{display:flex;gap:12px;align-items:center;border:2px solid var(--line);background:#fff;border-radius:16px;padding:12px 14px;text-align:right;width:100%;font-weight:400;min-height:64px;animation:rise .3s ease both}
.ans .no{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--panel2);font-weight:700;flex:none}
.ans .tx{flex:1;min-width:0;overflow-wrap:anywhere;white-space:pre-wrap;font-size:clamp(17px,2.2vw,22px);font-weight:700}
.ans .by{font-size:13px;color:var(--muted);font-weight:700;display:flex;gap:6px;align-items:center;flex-wrap:wrap;white-space:normal}
.ans .side{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:13px;color:var(--muted);min-width:64px}
.ans .side .ic{font-size:24px}
.ans .pts{font-family:var(--display);font-weight:400;font-size:28px;line-height:1;color:var(--ink)}
.ans.pick{cursor:pointer}
.ans.sel,.ans.win{border-color:var(--ok);background:#eef7f1}
.ans.sel .no,.ans.win .no{background:var(--ok);color:#fff}
.ans.lose{opacity:.7}
.ans.mine{box-shadow:0 0 0 3px #ecc56a99}
.ans.voted{border-color:var(--cyan);background:#eef8f9}
.ans.voted .no{background:var(--cyan);color:var(--cyan-ink)}
button.ans:disabled{opacity:.55}
.vbar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;width:64px}
.vbar i{display:block;height:100%;background:var(--cyan);border-radius:99px;transition:width .4s}
.tag{font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--panel2);color:var(--muted)}
.tag.fast{background:#fbf0d6;color:var(--gold-t)}
.log{display:flex;flex-direction:column;gap:8px}
.log .it{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.log .q{font-weight:700;overflow-wrap:anywhere}
.log .w{font-size:14px;color:var(--muted)}
.lb.one{grid-template-columns:1fr}
.lb li.up{animation:flashU 1.8s ease}
.lb li.down{animation:flashD 1.8s ease}
@keyframes flashU{0%,55%{background:#e3f3ea;border-color:var(--ok)}}
@keyframes flashD{0%,55%{background:#fbe9ea;border-color:var(--bad)}}
.delta{position:fixed;z-index:70;left:50%;top:38%;font-family:var(--display);font-size:64px;pointer-events:none;animation:fly 1.7s ease forwards}
.delta.up{color:var(--ok)} .delta.down{color:var(--bad)}
@keyframes fly{0%{opacity:0;transform:translate(-50%,20px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-90px) scale(1)}}
.podium3{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:12px;align-items:end}
.champ.n-c{border-color:var(--line);background:var(--panel)}
.podium3 .p1{padding-block:34px}
@media (max-width:640px){.slots{gap:6px}.slot{min-height:76px;padding:6px}.modes,.podium3{grid-template-columns:1fr}.podium3 .p1{order:-1}.ans{padding:10px}.ans .side{min-width:48px}}
/* قسم: شرح الدرس */
.inkp{margin-top:14px}
.inkp.full{position:fixed;inset:0;z-index:45;margin:0;border-radius:0;overflow:auto}
.inkstage{text-align:center;line-height:0}
.inkwrap{position:relative;display:inline-block;max-width:100%;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#fff}
.inkwrap img{display:block;max-width:100%;height:auto;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;-webkit-touch-callout:none}
.inkp.full .inkwrap img{max-height:calc(100vh - 120px);width:auto}

<script>
const SB_URL = 'https://pqkaotqtwdaoolbjzpyk.supabase.co';
const SB_KEY = 'sb_publishable_6TUp8IMl-Br4lmWOxZ-JHQ_hVFHr85v';
const sb = supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: false } });

const ERRORS = {
  BAD_PIN: 'الرمز السري غير صحيح', ROOM_NOT_FOUND: 'لا توجد ساحة بهذا الرمز', BAD_PIN_FORMAT: 'الرمز السري من 4 أرقام على الأقل',
  EMPTY: 'اكتب النص أولًا', EMPTY_NAME: 'اكتب اسمك أولًا', NOT_JOINED: 'انتهت مشاركتك، ادخل من جديد',

};

const roleCount = role => S.players.filter(p => p.role === role).length;

const MODES = [['peer', '🎯', 'السائل والمجيب', 'الطلاب يسألون ويجيبون على لوحة 16 مربعًا'], ['teacher', '🎤', 'المعلم يسأل', 'الجميع مجيبون، يلتقط السؤال ثلاثة، ومعه تصويت'], ['lesson', '📖', 'شرح الدرس', 'صورة الدرس، ثم تحضير الأسئلة والأجوبة، ثم التحدي']];

S.mute = !!LS.get('qa2_mute');

const now = () => Date.now() + S.offset;
const baseUrl = () => location.origin + location.pathname;
const studentLink = () => baseUrl() + '?code=' + S.code;

const fmt = s => s == null ? '--:--' : String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');

}

}
async function rpc(fn, args) { const { data, error } = await sb.rpc(fn, args); if (error) throw error; return data; }
async function syncClock() {
  try { const t0 = Date.now(); const d = await rpc('qa2_tick', { p_code: S.code || '0000' }); const t1 = Date.now(); S.offset = new Date(d.now).getTime() - (t0 + t1) / 2; } catch {}
}

/* ---------- الصوت ---------- */
let audio = null;
function tone(freqs, dur = .16, gap = .05, vol = .16, type = 'sine') {
  if (S.mute) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    let t = audio.currentTime;
    freqs.forEach(f => {
      const o = audio.createOscillator(), g = audio.createGain(); o.type = type;
      o.frequency.value = f; o.connect(g); g.connect(audio.destination);
      g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(.001, t + dur);
      o.start(t); o.stop(t + dur + .02); t += dur + gap;
    });
  } catch {}
}
const SFX = {
  tap: () => tone([520], .05, 0, .05),
  open: () => tone([523, 659, 784], .14, .03),
  capture: () => tone([880, 1175], .1, .02, .14, 'triangle'),
  ok: () => tone([523, 659, 784, 1046], .12, .03),
  plus: () => tone([659, 988, 1319], .1, .02, .15),
  minus: () => tone([392, 294], .2, .04, .13, 'triangle'),
  bad: () => tone([330, 247], .2, .04, .13, 'triangle'),
  vote: () => tone([740, 988], .08, .02, .1),
  voteOpen: () => tone([587, 740, 880, 740], .1, .02, .12),
  tick: () => tone([1000], .04, 0, .05),
  end: () => tone([523, 659, 784, 1046, 784, 1046], .14)

const buzz = p => { try { navigator.vibrate && navigator.vibrate(p); } catch {} };

  const el = document.createElement('div'); el.className = 'delta ltr ' + (d > 0 ? 'up' : 'down');
  el.textContent = d > 0 ? '+' + d : sc(d); document.body.appendChild(el); setTimeout(() => el.remove(), 1800);
}

  if (!diffs.length || !S.room || S.room.phase === 'lobby') return;
  if (S.mode === 'student') {
    const mine = diffs.find(x => S.me && x.id === S.me.player_id); if (!mine) return;

}

/* ---------- البيانات اللحظية ---------- */
async function loadRoom(code) {

}

    if (!r.data) return;
    const old = S.scoreMap, diffs = []; S.scoreMap = {};
    r.data.forEach(p => { S.scoreMap[p.id] = p.score; const d = old && old[p.id] != null ? p.score - old[p.id] : 0; if (d) { diffs.push({ id: p.id, d }); S.bumps[p.id] = { d, at: Date.now() }; } });

}

}

/* ---------- الساعة والانتقالات التلقائية ---------- */
function phaseTimer() {
  const r = S.room; if (!r) return { left: null };
  const total = { answer: r.answer_secs, t_answer: r.answer_secs, t_vote: r.vote_secs, l_prep: r.prep_min * 60 }[r.phase] || r.capture_secs;

}
function challengeLeft() {
  const r = S.room; if (!r) return null;

}
function tick() {

    const pct = pt.left == null ? 0 : Math.max(0, Math.min(100, pt.left / (pt.total || 30) * 100));

  });

}

function confetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = $('#confetti'), x = c.getContext('2d'); c.hidden = false;
  c.width = innerWidth; c.height = innerHeight;
  const colors = ['#ecc56a', '#7cc7cf', '#e2717f', '#4aa77a', '#a3a9d6'];
  const P = Array.from({ length: 160 }, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * .5, vx: (Math.random() - .5) * 3, vy: 2 + Math.random() * 4, s: 5 + Math.random() * 7, c: colors[Math.random() * 5 | 0], a: Math.random() * 6 }));
  let f = 0;
  (function step() {
    x.clearRect(0, 0, c.width, c.height);
    P.forEach(p => { p.x += p.vx; p.y += p.vy; p.a += .1; x.fillStyle = p.c; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); });
    if (++f < 260) requestAnimationFrame(step); else { c.hidden = true; }
  })();
}
function phaseSounds() {
  const r = S.room; if (!r) return;
  const tq = r.tq || {}, sig = { ph: r.phase, t: r.active_tile, q: tq.at, n: (tq.caps || []).length, v: Object.keys(tq.voters || {}).length };
  const prev = S.lastSig; S.lastSig = sig;
  if (!prev) return;
  if (prev.ph !== sig.ph || prev.t !== sig.t || prev.q !== sig.q) {
    if (r.phase === 'capture' || (r.phase === 't_capture' && prev.ph !== 't_capture')) { SFX.open(); buzz(200); }
    else if ((r.phase === 'answer' && prev.ph === 'capture') || (r.phase === 't_answer' && sig.n > prev.n)) SFX.capture();
    else if (r.phase === 't_vote') { SFX.voteOpen(); buzz(120); }
    else if (r.phase === 't_compose' && prev.ph === 't_capture') { SFX.bad(); toast('لم يلتقط أحد السؤال'); }
    else if (r.phase === 'board' && prev.ph === 'l_prep') { SFX.voteOpen(); buzz(150); toast('انتهى التحضير، بدأ التحدي!', 'win'); }
    else if (r.phase === 'ended') { SFX.end(); confetti(); }
  } else if (sig.n > prev.n) SFX.capture();

}

function swap(el, html) {
  const keep = {}, a = document.activeElement;
  el.querySelectorAll('input[id],textarea[id]').forEach(x => keep[x.id] = x.value);
  const f = a && el.contains(a) && a.id ? { id: a.id, s: a.selectionStart, e: a.selectionEnd } : null;
  el.innerHTML = html;
  for (const id in keep) { const x = el.querySelector('#' + id); if (x) x.value = keep[id]; }
  if (f) { const x = el.querySelector('#' + f.id); if (x) { x.focus(); try { x.setSelectionRange(f.s, f.e); } catch {} } }
}

    const body = `<span class="no">${i + 1}</span><span class="tx"><span class="by">${who} ${tags}</span>${has ? esc(c.a) : '<span class="muted" style="font-weight:500">لم يُجب في الوقت</span>'}</span>`;

function paintCounts(root, mine) {

  const hidden = S.mode !== 'teacher' && t.status === 'review';
  openModal(`<div class="kicker muted" style="font-weight:700">المربع ${i + 1} · ${tileStatusText(t) || (t.status === 'done' ? 'إجابة صحيحة' : t.status === 'wrong' ? 'إجابة خاطئة' : '')}</div>
    <div><label style="color:var(--gold-t)">السؤال · ${esc(pname(t.asker))}${(t.qpts || 0) + (t.qs || 0) ? ` (+${(t.qpts || 0) + (t.qs || 0)})` : ''}</label><div class="bigq" style="font-size:22px;text-align:right;margin:0">${hidden ? 'قيد مراجعة المعلم' : esc(t.q)}</div></div>
    ${t.answerer ? `<div><label style="color:var(--cyan-t)">الإجابة · ${esc(pname(t.answerer))}${t.apts != null ? ` (${t.apts > 0 ? '+' + t.apts : t.apts === -1 ? '−1' : '0'})` : ''}</label><div style="font-size:20px;font-weight:700">${t.a ? esc(t.a) : '—'}</div></div>` : ''}
    <button class="ghost" data-act="close">إغلاق</button>`);
}

/* ---------- الأحداث ---------- */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act;
  const lock = async fn => { b.disabled = true; try { await fn(); } finally { b.disabled = false; } };
  if (b.tagName === 'BUTTON' && !['mute', 'tvote', 't-capture', 'capture'].includes(a)) SFX.tap();
  switch (a) {
    case 'mute': S.mute = !S.mute; LS.set('qa2_mute', S.mute); document.querySelectorAll('[data-act="mute"]').forEach(x => x.textContent = S.mute ? '🔇' : '🔊'); if (!S.mute) SFX.ok(); break;
    case 'mode-pick': S.newMode = b.dataset.mode; document.querySelectorAll('#modes .modecard').forEach(x => x.classList.toggle('on', x === b)); $('#vote-wrap').hidden = S.newMode !== 'teacher'; $('#prep-wrap').hidden = S.newMode !== 'lesson'; break;
    case 'fs': try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch {} break;
    case 'img-pick': $('#img-file').click(); break;
    case 'img-del': await lock(() => act('set_image', { data: '' })); break;
    case 'end-prep': await lock(() => act('end_prep')); break;
    case 'tool': S.tool = b.dataset.tool; document.querySelectorAll('.inktools .tool').forEach(x => x.classList.toggle('on', x.dataset.tool === S.tool)); document.querySelectorAll('.inkwrap').forEach(x => x.classList.toggle('hand', S.tool === 'hand' || !x.querySelector('canvas'))); break;
    case 'ink-color': S.color = b.dataset.c; if (S.tool === 'hand' || S.tool === 'er') { S.tool = 'pen'; document.querySelectorAll('.inktools .tool').forEach(x => x.classList.toggle('on', x.dataset.tool === 'pen')); document.querySelectorAll('.inkwrap').forEach(x => x.classList.toggle('hand', !x.querySelector('canvas'))); } document.querySelectorAll('.inktools .sw').forEach(x => x.classList.toggle('on', x === b)); break;
    case 'ink-undo': S.ink.strokes.pop(); inkSave(); inkDrawAll(); break;
    case 'ink-clear': if (S.ink.strokes.length && confirm('مسح كل ما رسمته على الصورة؟')) { S.ink.strokes = []; inkSave(); inkDrawAll(); } break;
    case 'ink-full': { const p = $('#inkp'); if (p) { p.classList.toggle('full'); setTimeout(inkDrawAll, 50); } break; }
    case 'prep-add': S.prep.push(''); $('#prep-list').innerHTML = prepRows(S.mePlayer && S.mePlayer.role === 'asker'); { const t = document.querySelectorAll('#prep-list textarea'); t[t.length - 1].focus(); } break;
    case 'prep-del': S.prep.splice(+b.dataset.i, 1); if (!S.prep.length) S.prep.push(''); $('#prep-list').innerHTML = prepRows(S.mePlayer && S.mePlayer.role === 'asker'); savePrep(); break;
    case 'prep-ask': await lock(async () => {
      const t = myPrep()[+b.dataset.i], tile = (S.room.tiles || []).findIndex(x => !x.q);
      if (!t || tile < 0) return toast('لا يوجد مربع فارغ الآن', 'err');
      const d = await sact('claim', { tile, text: t }); if (d && d.ok) toast('كنت الأسرع! +1 للسرعة، وسؤالك عند المعلم', 'win');
    }); break;
    case 'prep-ans': await lock(async () => { const d = await sact('answer', { text: myPrep()[+b.dataset.i] }); if (d && d.ok) toast('أُرسلت إجابتك', 'win'); }); break;
    case 'set-mode': if (S.room.mode !== b.dataset.mode) await lock(() => act('set_mode', { mode: b.dataset.mode })); break;
    case 't-ask': { const t = $('#t-q').value.trim(); if (!t) return toast(ERRORS.EMPTY, 'err'); await lock(async () => { if (await act('t_ask', { text: t })) { const x = $('#t-q'); if (x) x.value = ''; } }); break; }
    case 't-close-cap': await lock(() => act('t_close_capture')); break;
    case 't-end-ans': await lock(() => act('t_end_answer')); break;
    case 'tsel': { const i = +b.dataset.i; S.sel.has(i) ? S.sel.delete(i) : S.sel.add(i); S.keys.stage = null; updateTeacher(); break; }
    case 't-judge': await lock(async () => { if (await act('t_judge', { correct: [...S.sel] })) { if (!S.sel.size) SFX.bad(); } }); break;
    case 't-vote': await lock(() => act('t_vote', { seconds: +($('#t-vs') || {}).value || S.room.vote_secs })); break;
    case 't-close-vote': await lock(() => act('t_close_vote')); break;
    case 't-cancel': await lock(() => act('t_cancel')); break;
    case 't-capture': await lock(async () => { const d = await sact('t_capture'); if (d && d.ok) { SFX.capture(); buzz([60, 40, 60]); toast(`التقطته! أنت رقم ${d.slot}، أجب بسرعة`, 'win'); } }); break;
    case 't-send-a': { const t = $('#s-a').value.trim(); if (!t) return toast(ERRORS.EMPTY, 'err'); await lock(async () => { const d = await sact('t_answer', { text: t }); if (d && d.ok) { SFX.ok(); toast('أُرسلت إجابتك', 'win'); } }); break; }
    case 'tvote': await lock(async () => { const d = await sact('t_vote', { idx: +b.dataset.i }); if (d && d.ok) { SFX.vote(); buzz(40); toast('سُجّل صوتك', 'win'); } }); break;
    case 'home': go(''); renderHome(); break;
    case 'home-teacher': teacherEntry(); break;
    case 'back': if (history.length > 1) history.back(); else location.href = baseUrl() + (LS.get('qa2_teacher') ? '?t=' + S.code : ''); break;
    case 'gate': await lock(async () => {
      const m = $('#in-master').value.trim(); if (!m) return toast('أدخل الرقم السري', 'err');
      let ok = false; try { ok = await rpc('qa2_check_master', { p_pin: m }); } catch (err) { return toast(errText(err), 'err'); }
      if (!ok) { $('#in-master').value = ''; return toast('الرقم السري غير صحيح', 'err'); }
      LS.set('qa2_master', m); renderTeacherLogin(S.gateCode);
    }); break;
    case 'home-student': renderStudentCode(); break;
    case 'resume-teacher': { const s = LS.get('qa2_teacher'); startTeacher(s.code, s.pin); break; }
    case 'code-go': { const c = $('#in-code').value.trim(); if (!/^\d{4}$/.test(c)) return toast('الرمز من 4 أرقام', 'err'); startStudent(c); break; }
    case 'create': await lock(async () => {
      const pin = LS.get('qa2_master'); if (!pin) return teacherEntry();
      try {
        const d = await rpc('qa2_create_room', { p_pin: pin, p_title: $('#in-title').value, p_cfg: { duration_min: +$('#in-dur').value, capture_secs: +$('#in-cap').value, answer_secs: +$('#in-ans').value } });
        if (S.newMode !== 'peer') {
          await rpc('qa2_teacher', { p_code: d.code, p_pin: pin, p_action: 'set_mode', p_args: { mode: S.newMode } });
          await rpc('qa2_teacher', { p_code: d.code, p_pin: pin, p_action: 'config', p_args: { vote_secs: +$('#in-vote').value, prep_min: +$('#in-prep').value } });
        }
        await startTeacher(d.code, pin);
      } catch (err) { toast(errText(err), 'err'); }
    }); break;
    case 'resume-login': { const c = $('#in-rcode').value.trim(), p = LS.get('qa2_master'); if (!/^\d{4}$/.test(c)) return toast('رمز الساحة من 4 أرقام', 'err'); if (!p) return teacherEntry(c); startTeacher(c, p); break; }
    case 'start': await lock(async () => {
      if (await act('config', { duration_min: +$('#l-dur').value, capture_secs: +$('#l-cap').value, answer_secs: +$('#l-ans').value, vote_secs: +($('#l-vote') || {}).value || undefined, prep_min: +($('#l-prep') || {}).value || undefined })) await act('start');
    }); break;
    case 'approve': await lock(() => act('approve_q')); break;
    case 'reject': await lock(() => act('reject_q')); break;
    case 'judge': await lock(async () => { const ok = b.dataset.v === '1'; if (await act('judge', { correct: ok }) && !ok) SFX.bad(); }); break;
    case 'cancel-q': await lock(() => act('cancel_q')); break;
    case 't-pause': await lock(() => act('timer_pause')); break;
    case 't-resume': await lock(() => act('timer_resume')); break;
    case 't-add': await lock(() => act('timer_add', { seconds: +b.dataset.s })); break;
    case 'c-pause': await lock(() => act('challenge_pause')); break;
    case 'c-resume': await lock(() => act('challenge_resume')); break;
    case 'c-add': await lock(() => act('challenge_add', { minutes: +b.dataset.m })); break;
    case 'new-board': await lock(() => act('new_board')); break;
    case 'ask-end': openModal(`<h3>إنهاء التحدي الآن؟</h3><p>ستُرصد النقاط الحالية ويُعلن الفائزون.</p>
      <div class="row"><button class="bad" data-act="end" style="flex:1">نعم، أنهِ التحدي</button><button class="ghost" data-act="close">إلغاء</button></div>`); break;
    case 'end': await act('end_now'); closeModal(); break;
    case 'ask-reset': openModal(`<h3>تحدٍّ جديد؟</h3><p>ستعود نقاط الجميع إلى صفر، ويرجع الطلاب لاختيار أدوارهم.</p>
      <div class="row"><button class="gold" data-act="reset" style="flex:1">نعم، ابدأ من جديد</button><button class="ghost" data-act="close">إلغاء</button></div>`); break;
    case 'reset': await act('reset'); closeModal(); break;
    case 'player': {
      const p = S.players.find(x => x.id === b.dataset.p); if (!p) return;
      openModal(`<h3>${esc(p.name)} ${TM() ? '' : `<span class="badge ${p.role}">${ROLE[p.role]}</span>`}</h3>
        ${TM() ? '' : `<div class="roles"><button class="rolecard asker ${p.role === 'asker' ? 'on' : ''}" data-act="set-role" data-p="${p.id}" data-role="asker"><b>سائل</b></button>
        <button class="rolecard answerer ${p.role === 'answerer' ? 'on' : ''}" data-act="set-role" data-p="${p.id}" data-role="answerer"><b>مجيب</b></button></div>`}
        ${LM() && (p.prep || []).length ? `<div><label>ما جهّزه (${p.prep.length})</label><ol style="margin:0;padding-inline-start:22px">${p.prep.map(x => `<li>${esc(x)}</li>`).join('')}</ol></div>` : ''}
        <div class="row" style="justify-content:center"><button data-act="pscore" data-p="${p.id}" data-d="-1">−1 نقطة</button><b class="num ltr" style="font-family:var(--display);font-size:34px;min-width:60px;text-align:center">${sc(p.score)}</b><button data-act="pscore" data-p="${p.id}" data-d="1">+1 نقطة</button></div>
        <div class="row"><button class="bad" data-act="kick" data-p="${p.id}">إخراج من الساحة</button><button class="ghost" data-act="close" style="flex:1">إغلاق</button></div>`);
      break;
    }
    case 'set-role': await act('set_role', { player: b.dataset.p, role: b.dataset.role }); closeModal(); break;
    case 'pscore': await act('score', { player: b.dataset.p, delta: +b.dataset.d }); closeModal(); break;
    case 'kick': await act('kick', { player: b.dataset.p }); closeModal(); break;
    case 'share': {
      const link = studentLink();
      openModal(`<h3>دخول الطلاب</h3><p class="muted" style="margin:0">امسح الرمز أو افتح الرابط، ثم اكتب الاسم واختر الدور.</p>
        <div class="qr"><img src="${qrImg(link, 8)}" alt="رمز QR لرابط الطلاب"></div>
        <div class="linkbox" id="m-link">${esc(link)}</div>
        <div class="row"><button class="gold" style="flex:1" data-act="copy">نسخ الرابط</button><button class="ghost" data-act="close">إغلاق</button></div>`);
      break;
    }
    case 'copy': {
      try { await navigator.clipboard.writeText(studentLink()); toast('تم نسخ الرابط'); }
      catch { const rg = document.createRange(); rg.selectNodeContents($('#m-link')); getSelection().removeAllRanges(); getSelection().addRange(rg); toast('حدّد الرابط وانسخه'); }
      break;
    }
    case 'settings':
      openModal(`<h3>الإعدادات</h3>
        <div><label for="m-title">اسم التحدي</label><input id="m-title" maxlength="60" value="${esc(S.room.title)}"></div>
        <div class="grid2"><div><label for="m-cap">وقت الالتقاط (ث)</label><input id="m-cap" type="number" min="5" max="300" value="${S.room.capture_secs}"></div>
        <div><label for="m-ans">وقت الإجابة (ث)</label><input id="m-ans" type="number" min="5" max="300" value="${S.room.answer_secs}"></div></div>
        ${TM() ? `<div><label for="m-vote">وقت التصويت (ث)</label><input id="m-vote" type="number" min="5" max="300" value="${S.room.vote_secs}"></div>` : ''}
        <button class="gold" data-act="save-settings">حفظ</button>
        ${S.room.phase !== 'lobby' ? '<button data-act="ask-reset">تحدٍّ جديد (تصفير النقاط)</button>' : ''}
        <details><summary class="muted" style="cursor:pointer;font-weight:700">تغيير الرقم السري للمعلم</summary><div class="stack" style="margin-top:10px">
          <input id="m-old" type="password" inputmode="numeric" placeholder="الرقم الحالي" aria-label="الرقم الحالي"><input id="m-new" type="password" inputmode="numeric" placeholder="الرقم الجديد (4 أرقام أو أكثر)" aria-label="الرقم الجديد">
          <button data-act="change-master">حفظ الرقم الجديد</button></div></details>
        <button class="ghost" data-act="logout">الخروج من لوحة المعلم</button>
        <button class="ghost" data-act="close">إغلاق</button>`);
      break;
    case 'save-settings': await act('config', { title: $('#m-title').value, capture_secs: +$('#m-cap').value, answer_secs: +$('#m-ans').value, vote_secs: +($('#m-vote') || {}).value || undefined }); S.keys = {}; closeModal(); break;
    case 'logout': LS.del('qa2_teacher'); LS.del('qa2_master'); closeModal(); location.href = baseUrl(); break;
    case 'change-master': await lock(async () => {
      try { await rpc('qa2_change_master', { p_old: $('#m-old').value.trim(), p_new: $('#m-new').value.trim() }); LS.set('qa2_master', $('#m-new').value.trim()); toast('تم تغيير الرقم السري', 'win'); closeModal(); }
      catch (err) { toast(errText(err), 'err'); }
    }); break;
    case 'close': closeModal(); break;
    case 'view': viewTile(+b.dataset.tile); break;
    case 'pick': document.querySelectorAll('#pick .rolecard').forEach(x => x.classList.toggle('on', x === b)); S.pickRole = b.dataset.role; break;
    case 'join': await lock(async () => {
      const name = $('#in-name').value.trim(); if (!name) return toast(ERRORS.EMPTY_NAME, 'err');
      const role = TM() ? 'answerer' : S.pickRole;
      if (!role) return toast('اختر دورك: سائل أو مجيب', 'err');
      try {
        const d = await rpc('qa2_join', { p_code: S.code, p_name: name, p_role: role });
        S.me = { token: d.token, player_id: d.player_id, name, role };
        LS.set('qa2_player_' + S.code, S.me); studentPlay();
      } catch (err) { toast(errText(err), 'err'); }
    }); break;
    case 'switch': await lock(() => sact('set_role', { role: b.dataset.role })); break;
    case 'compose': {
      const i = +b.dataset.tile;
      openModal(`<h3><span style="color:var(--gold-t)">المربع ${i + 1}</span> · اكتب سؤالك</h3>
        <p class="muted" style="margin:0">سؤال واحد واضح. عند الإرسال تُقفل اللوحة أمام زملائك حتى يُحسم سؤالك.</p>
        <textarea id="m-q" maxlength="300" placeholder="اكتب السؤال هنا"></textarea>
        <div class="row"><button class="gold" data-act="send-q" data-tile="${i}" style="flex:1;min-height:56px;font-size:19px">إرسال السؤال</button><button class="ghost" data-act="close">إلغاء</button></div>`, 'compose');
      $('#m-q').focus(); break;
    }
    case 'send-q': await lock(async () => {
      const t = $('#m-q').value.trim(); if (!t) return toast(ERRORS.EMPTY, 'err');
      $('#modal').dataset.kind = '';
      const d = await sact('claim', { tile: +b.dataset.tile, text: t });
      if (d && d.ok) { closeModal(); toast('أُرسل سؤالك إلى المعلم', 'win'); } else $('#modal').dataset.kind = 'compose';
    }); break;
    case 'capture': await lock(async () => { const d = await sact('capture'); if (d && d.ok) { toast('التقطته! أجب بسرعة', 'win'); try { navigator.vibrate && navigator.vibrate([60, 40, 60]); } catch {} } }); break;
    case 'send-a': { const t = $('#s-a').value.trim(); if (!t) return toast(ERRORS.EMPTY, 'err'); await lock(async () => { const d = await sact('answer', { text: t }); if (d && d.ok) toast('أُرسلت إجابتك', 'win'); }); break; }
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'in-code') $('[data-act="code-go"]').click();
  if (e.key === 'Enter' && e.target.id === 'in-master') $('[data-act="gate"]').click();
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.click(); }
});
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
boot();
</script>
</body>
</html>
